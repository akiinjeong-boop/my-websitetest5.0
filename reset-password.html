<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - ระบบส่งงานออนไลน์</title>
    <link rel="icon" type="image/png" href="photo/icon1.png">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: radial-gradient(circle at top right, #1b2838, #0d131d);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            position: relative;
            overflow: hidden;
        }

        /* ตกแต่ง background ลายจุดแสงแบบเว็บบอร์ดเทคโนโลยี */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .container { 
            background: #ffffff; 
            padding: 40px 35px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* โลโก้/ไอคอนส่วนหัว */
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1b2838, #2a3f5a);
            color: #f39c12;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        h2 { 
            color: #0f172a; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 24px;
        }

        p#user-email-display { 
            color: #475569; 
            font-size: 14px; 
            margin-bottom: 25px; 
            background: #f1f5f9;
            padding: 8px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #e2e8f0;
            word-break: break-all;
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }

        label { 
            display: block; 
            font-size: 14px; 
            font-weight: 600;
            margin-bottom: 8px; 
            color: #1e293b; 
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 16px;
        }

        input { 
            width: 100%; 
            padding: 12px 14px 12px 42px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.3s ease; 
            background: #f8fafc;
            color: #0f172a;
        }

        input:focus { 
            border-color: #f39c12; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.15);
        }

        button[type="submit"] { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #f39c12, #e67e22); 
            border: none; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        button[type="submit"]:hover { 
            background: linear-gradient(135deg, #e67e22, #d35400); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.4);
        }

        button[type="submit"]:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden { display: none !important; }

        /* Overlay & Popup Styling */
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(4px);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            animation: fadeIn 0.2s ease;
        }

        .popup { 
            background: white; 
            padding: 30px 25px; 
            border-radius: 16px; 
            max-width: 360px; 
            width: 88%; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); 
            text-align: center; 
            animation: scaleUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .popup h3 { 
            margin-bottom: 10px; 
            font-size: 20px; 
            font-weight: 700;
        }

        .popup p { 
            color: #475569; 
            font-size: 15px; 
            margin-bottom: 20px; 
            line-height: 1.5;
        }

        .popup button { 
            background: #1b2838; 
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .popup button:hover {
            background: #2a3f5a;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- iOS Loading Checkmark & Crossmark Animation Style --- */
        .loading-modal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            background: #1e293b;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .loading-modal-box p {
            color: #f1f5f9 !important;
            margin-bottom: 0 !important;
        }

        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .ios-loader-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .ios-loader {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #334155;
            stroke-width: 6;
        }

        .circle-spinner {
            fill: none;
            stroke: #f39c12;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 160;
            animation: spin 1.2s linear infinite;
            transform-origin: center;
            transition: all 0.4s ease-in-out;
        }

        .icon-svg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .checkmark-path {
            fill: none;
            stroke: #10b981;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            transition: stroke-dashoffset 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.2s;
        }

        .crossmark-path {
            fill: none;
            stroke: #ef4444;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            transition: stroke-dashoffset 0.3s cubic-bezier(0.65, 0, 0.45, 1);
        }

        .crossmark-path.line2 {
            transition-delay: 0.15s;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ios-loader-wrapper.success .circle-spinner {
            animation: none;
            stroke: #10b981;
            stroke-dashoffset: 0;
            transform: rotate(0deg);
        }

        .ios-loader-wrapper.success .checkmark-path {
            stroke-dashoffset: 0;
        }

        .ios-loader-wrapper.error .circle-spinner {
            animation: none;
            stroke: #ef4444;
            stroke-dashoffset: 0;
            transform: rotate(0deg);
        }

        .ios-loader-wrapper.error .crossmark-path {
            stroke-dashoffset: 0;
        }

        #loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ไอคอนเพิ่มความสวยงามแบบเข้าธีม -->
        <div class="brand-icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <p id="user-email-display">กำลังโหลดข้อมูล...</p>

        <form id="reset-form" onsubmit="handleResetPassword(event)">
            <div class="input-group">
                <label for="new-pass">รหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="new-pass" placeholder="กรอกรหัสผ่านใหม่" required>
                </div>
            </div>
            <div class="input-group">
                <label for="confirm-pass">ยืนยันรหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="confirm-pass" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required>
                </div>
            </div>
            <button type="submit" id="btn-submit">ยืนยันเปลี่ยนรหัสผ่าน</button>
        </form>
    </div>

    <!-- Modal อนิเมชั่นโหลด / สำเร็จ / ผิดพลาด -->
    <div id="loading-modal" class="overlay hidden">
        <div class="popup loading-modal-box" id="modalBox">
            <div class="ios-loader-wrapper" id="loaderWrapper">
                <svg class="ios-loader" viewBox="0 0 80 80">
                    <circle class="circle-bg" cx="40" cy="40" r="35" />
                    <circle class="circle-spinner" cx="40" cy="40" r="35" />
                </svg>
                <svg class="icon-svg" viewBox="0 0 80 80">
                    <path class="checkmark-path" d="M30 43 L37 51 L51 31" />
                </svg>
                <svg class="icon-svg" viewBox="0 0 80 80">
                    <path class="crossmark-path line1" d="M28 28 L52 52" />
                    <path class="crossmark-path line2" d="M52 28 L28 52" />
                </svg>
            </div>
            <p id="loading-text">กำลังตรวจสอบข้อมูล...</p>
        </div>
    </div>

    <!-- Popup แจ้งเตือน -->
    <div id="popup-message" class="overlay hidden">
        <div class="popup">
            <h3 id="popup-title">แจ้งเตือน</h3>
            <p id="popup-text"></p>
            <button id="popup-btn" onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyBHU2Aw_fpj0K6RhjcH7DIIwwtJIr3Bb1QQW3aUUjM9qMapXMUKvh6KkZhfvoIUXOg/exec";

        let currentToken = "";
        let currentEmail = "";
        let currentRole = "";
        let redirectPage = "student-login.html";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentToken = urlParams.get('token');
            currentEmail = urlParams.get('email');
            currentRole = urlParams.get('role') || 'student';

            redirectPage = currentRole === 'teacher' ? 'teacher-login.html' : 'student-login.html';

            if (!currentToken || !currentEmail) {
                showPopup("ข้อผิดพลาด", "ลิงก์นี้ไม่ถูกต้องหรือหมดอายุ", false, () => {
                    window.location.href = redirectPage;
                });
            } else {
                document.getElementById('user-email-display').innerText = "สำหรับบัญชี: " + currentEmail;
            }
        };

        function showLoading(text = "กำลังตรวจสอบข้อมูล...") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            const modalBox = document.getElementById('modalBox');
            loaderWrapper.classList.remove('success', 'error');
            modalBox.classList.remove('shake');
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-modal').classList.remove('hidden');
        }

        function showSuccess(text = "ทำรายการสำเร็จ!") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            loaderWrapper.classList.remove('error');
            loaderWrapper.classList.add('success');
            document.getElementById('loading-text').innerText = text;
        }

        function showError(text = "เกิดข้อผิดพลาด!") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            const modalBox = document.getElementById('modalBox');
            loaderWrapper.classList.remove('success');
            loaderWrapper.classList.add('error');
            modalBox.classList.remove('shake');
            void modalBox.offsetWidth;
            modalBox.classList.add('shake');
            document.getElementById('loading-text').innerText = text;
        }

        function hideLoading() {
            document.getElementById('loading-modal').classList.add('hidden');
        }

        function showPopup(title, text, isSuccess = true, callback = null) {
            const titleEl = document.getElementById('popup-title');
            titleEl.innerText = title;
            titleEl.style.color = isSuccess ? '#27ae60' : '#e74c3c';
            document.getElementById('popup-text').innerText = text;
            document.getElementById('popup-message').classList.remove('hidden');

            window.popupCallback = callback;
        }

        function closePopup() {
            document.getElementById('popup-message').classList.add('hidden');
            if (window.popupCallback) window.popupCallback();
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value.trim();
            const confirmPass = document.getElementById('confirm-pass').value.trim();

            if (newPass !== confirmPass) {
                showError("รหัสผ่านไม่ตรงกัน!");
                setTimeout(() => {
                    hideLoading();
                    showPopup("แจ้งเตือน", "รหัสผ่านทั้ง 2 ช่องไม่ตรงกัน", false);
                }, 1200);
                return;
            }

            showLoading("กำลังอัปเดตรหัสผ่าน...");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "confirm_password_reset",
                        token: currentToken,
                        email: currentEmail,
                        role: currentRole,
                        newPassword: newPass
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    showSuccess("อัปเดตรหัสผ่านสำเร็จ!");
                    setTimeout(() => {
                        window.location.href = redirectPage;
                    }, 1200);
                } else {
                    showError("ลิงก์หมดอายุหรือผิดพลาด!");
                    setTimeout(() => {
                        hideLoading();
                        showPopup("ข้อผิดพลาด", result.message || "ลิงก์หมดอายุ หรือเกิดข้อผิดพลาด", false);
                    }, 1200);
                }
            } catch (err) {
                showError("เชื่อมต่อระบบล้มเหลว!");
                setTimeout(() => {
                    hideLoading();
                    showPopup("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อระบบหลังบ้านได้", false);
                }, 1200);
            }
        }
    </script>
</body>
</html>
