<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกประเภทการเข้าสู่ระบบ - วิทยาลัยอาชีวศึกษาชุมพร</title>
    <link rel="icon" type="image/png" href="photo/icon1.png">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(245, 158, 11, 0.12);
            filter: blur(120px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .header-logo img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .header-logo .brand-text {
            text-align: left;
        }

        .header-logo .brand-text h1 {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .header-logo .brand-text span {
            font-size: 12px;
            color: #94a3b8;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .option-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #ffffff;
        }

        .option-card:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .option-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .option-text h3 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .option-text p {
            font-size: 12px;
            color: #94a3b8;
        }

        .arrow-icon {
            color: #64748b;
            font-size: 14px;
            transition: transform 0.3s, color 0.3s;
        }

        .option-card:hover .arrow-icon {
            color: #f59e0b;
            transform: translateX(4px);
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .btn-home:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logo">
            <img src="photo/icon2.png" alt="Logo" onerror="this.src='https://img.icons8.com/color/96/graduation-cap.png'">
            <div class="brand-text">
                <h1>วิทยาลัยอาชีวศึกษาชุมพร</h1>
                <span>Chumphon Vocational College</span>
            </div>
        </div>

        <h2>ยินดีต้อนรับ</h2>
        <p class="subtitle">กรุณาเลือกประเภทบัญชีผู้ใช้เพื่อเข้าสู่ระบบ</p>

        <a href="student-login.html" class="option-card">
            <div class="option-info">
                <div class="icon-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="option-text">
                    <h3>เข้าสู่ระบบนักเรียน</h3>
                    <p>สำหรับนักเรียน นักศึกษา ส่งงานและดูผลเรียน</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>

        <a href="teacher-login.html" class="option-card">
            <div class="option-info">
                <div class="icon-box" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa;">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <div class="option-text">
                    <h3>เข้าสู่ระบบคุณครู</h3>
                    <p>สำหรับครูผู้สอน และครูที่ปรึกษา</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>

        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> กลับสู่หน้าหลัก
        </a>
    </div>

</body>
</html>
