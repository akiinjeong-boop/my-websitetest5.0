<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบส่งงานนักเรียนออนไลน์ - วิทยาลัยอาชีวศึกษาชุมพร</title>
    <link rel="icon" type="image/png" href="photo/icon1.png">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        /* ตกแต่ง Background Glow Effect แบบกระจายแสงโทนสีน้ำเงิน-ทอง */
        body::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            background: rgba(59, 130, 246, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 15%;
            left: 10%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .header-logo img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .header-logo .brand-text {
            text-align: left;
        }

        .header-logo .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .header-logo .brand-text span {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .badge-role {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            border: none;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-register {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }

        .btn-back {
            background: transparent;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 500;
        }

        .btn-back:hover {
            background: transparent;
            color: #ffffff;
            box-shadow: none;
            transform: none;
        }

        .forgot-container {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-link {
            display: inline-block;
            font-size: 13px;
            color: #f59e0b;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #fbbf24;
        }

        .hidden { display: none !important; }

        /* Modal & Popup Stylings */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .popup h3 {
            margin-bottom: 12px;
            font-size: 20px;
            color: #ffffff;
        }

        .popup p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .popup button {
            background: #ef4444;
            color: #ffffff;
            margin-top: 10px;
        }

        .popup button:hover {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-ok {
            background: #10b981 !important;
            color: #ffffff !important;
        }

        .btn-ok:hover {
            background: #059669 !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3) !important;
        }

        .btn-cancel {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;
            border: 1px solid rgba(239, 68, 68, 0.3) !important;
        }

        .btn-cancel:hover {
            background: #ef4444 !important;
            color: #ffffff !important;
        }

        /* --- iOS Loading Checkmark & Crossmark Animation Style --- */
        .loading-modal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            transition: transform 0.3s ease;
        }

        /* Shake Animation สำหรับกรณีรหัสผิดพลาด */
        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .ios-loader-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .ios-loader {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #334155;
            stroke-width: 6;
        }

        .circle-spinner {
            fill: none;
            stroke: #f59e0b; /* สีส้มทองธีมหลัก */
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 160;
            animation: spin 1.2s linear infinite;
            transform-origin: center;
            transition: all 0.4s ease-in-out;
        }

        .icon-svg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .checkmark-path {
            fill: none;
            stroke: #10b981; /* สีเขียวสำเร็จ */
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            transition: stroke-dashoffset 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.2s;
        }

        .crossmark-path {
            fill: none;
            stroke: #ef4444; /* สีแดงข้อผิดพลาด */
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            transition: stroke-dashoffset 0.3s cubic-bezier(0.65, 0, 0.45, 1);
        }

        .crossmark-path.line2 {
            transition-delay: 0.15s;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* สถานะเมื่อโหลดสำเร็จ (Success State) */
        .ios-loader-wrapper.success .circle-spinner {
            animation: none;
            stroke: #10b981;
            stroke-dashoffset: 0;
            transform: rotate(0deg);
        }

        .ios-loader-wrapper.success .checkmark-path {
            stroke-dashoffset: 0;
        }

        /* สถานะเมื่อเกิดข้อผิดพลาด (Error State - กากบาท) */
        .ios-loader-wrapper.error .circle-spinner {
            animation: none;
            stroke: #ef4444;
            stroke-dashoffset: 0;
            transform: rotate(0deg);
        }

        .ios-loader-wrapper.error .crossmark-path {
            stroke-dashoffset: 0;
        }

        #loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <!-- Logo Header -->
        <div class="header-logo">
            <img src="photo/icon2.png" alt="Logo" onerror="this.src='https://img.icons8.com/color/96/graduation-cap.png'">
            <div class="brand-text">
                <h1>วิทยาลัยอาชีวศึกษาชุมพร</h1>
                <span>Chumphon Vocational College</span>
            </div>
        </div>

        <span class="badge-role"><i class="fa-solid fa-graduation-cap"></i> นักเรียน / นักศึกษา</span>

        <h2>เข้าสู่ระบบนักเรียน</h2>

        <div class="input-group">
            <label for="student-id">เลขประจำตัวนักเรียน หรือ อีเมล</label>
            <div class="input-wrapper">
                <i class="fa-regular fa-id-card"></i>
                <input type="text" id="student-id" placeholder="กรอกเลขประจำตัว หรือ อีเมล">
            </div>
        </div>

        <div class="input-group">
            <label for="password">รหัสผ่าน</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
            </div>
            <div class="forgot-container">
                <a class="forgot-link" onclick="openForgotModal()">ลืมรหัสผ่าน?</a>
            </div>
        </div>

        <button id="btn-submit" onclick="handleLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
        </button>

        <button class="btn-register" onclick="location.href='register.html'">
            <i class="fa-solid fa-user-plus"></i> สมัครสมาชิก
        </button>

        <button class="btn-back" onclick="location.href='login.html'">
            <i class="fa-solid fa-arrow-left"></i> ย้อนกลับ
        </button>
    </div>

    <!-- Modal อนิเมชั่นกำลังเข้าสู่ระบบ / สำเร็จ / ผิดพลาด (iOS Checkmark & Crossmark) -->
    <div id="loading-modal" class="overlay hidden">
        <div class="popup loading-modal-box" id="modalBox">
            <div class="ios-loader-wrapper" id="loaderWrapper">
                <svg class="ios-loader" viewBox="0 0 80 80">
                    <circle class="circle-bg" cx="40" cy="40" r="35" />
                    <circle class="circle-spinner" cx="40" cy="40" r="35" />
                </svg>
                <!-- SVG ติ๊กถูก -->
                <svg class="icon-svg" viewBox="0 0 80 80">
                    <path class="checkmark-path" d="M30 43 L37 51 L51 31" />
                </svg>
                <!-- SVG กากบาท -->
                <svg class="icon-svg" viewBox="0 0 80 80">
                    <path class="crossmark-path line1" d="M28 28 L52 52" />
                    <path class="crossmark-path line2" d="M52 28 L28 52" />
                </svg>
            </div>
            <p id="loading-text">กำลังตรวจสอบข้อมูล...</p>
        </div>
    </div>

    <!-- Popup แจ้งเตือนทั่วไป -->
    <div id="popup-message" class="overlay hidden">
        <div class="popup">
            <h3 id="popup-title" style="color: #ef4444;">แจ้งเตือน</h3>
            <p id="popup-text">ชื่อผู้ใช้และรหัสผ่านผิดพลาด</p>
            <button onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <!-- Modal กรอก Gmail เพื่อรับลิงก์รีเซ็ตรหัสผ่าน -->
    <div id="forgot-modal" class="overlay hidden">
        <div class="popup" style="max-width: 380px;">
            <h3 style="color: #f59e0b;"><i class="fa-solid fa-key"></i> ตั้งรหัสผ่านใหม่</h3>
            <p style="text-align: left; font-size: 13px; color: #94a3b8; margin-top: 5px;">กรอก Gmail ที่คุณใช้สมัครเรียน ระบบจะทำการตรวจสอบและส่งลิงก์เปลี่ยนรหัสผ่านไปที่ Gmail ของคุณ</p>
            <div class="input-group" style="margin-top: 15px;">
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="reset-email" placeholder="example@gmail.com">
                </div>
            </div>
            <button id="btn-send-link" class="btn-ok" onclick="handleSendResetLink()">ส่งลิงก์เปลี่ยนรหัสผ่าน</button>
            <button class="btn-cancel" onclick="closeForgotModal()">ยกเลิก</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyBHU2Aw_fpj0K6RhjcH7DIIwwtJIr3Bb1QQW3aUUjM9qMapXMUKvh6KkZhfvoIUXOg/exec";

        function showLoading(text = "กำลังตรวจสอบข้อมูล...") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            const modalBox = document.getElementById('modalBox');
            
            loaderWrapper.classList.remove('success', 'error');
            modalBox.classList.remove('shake');
            
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-modal').classList.remove('hidden');
        }

        function showSuccess(text = "เข้าสู่ระบบสำเร็จ!") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            loaderWrapper.classList.remove('error');
            loaderWrapper.classList.add('success');
            document.getElementById('loading-text').innerText = text;
        }

        function showError(text = "ชื่อผู้ใช้หรือรหัสผ่านผิดพลาด!") {
            const loaderWrapper = document.getElementById('loaderWrapper');
            const modalBox = document.getElementById('modalBox');
            
            loaderWrapper.classList.remove('success');
            loaderWrapper.classList.add('error');
            
            // เพิ่มการสั่น
            modalBox.classList.remove('shake');
            void modalBox.offsetWidth; // Trigger reflow
            modalBox.classList.add('shake');
            
            document.getElementById('loading-text').innerText = text;
        }

        function hideLoading() {
            document.getElementById('loading-modal').classList.add('hidden');
        }

        function showPopup(title, text) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-text').innerText = text;
            document.getElementById('popup-message').classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popup-message').classList.add('hidden');
        }

        function openForgotModal() {
            document.getElementById('reset-email').value = '';
            document.getElementById('forgot-modal').classList.remove('hidden');
        }

        function closeForgotModal() {
            document.getElementById('forgot-modal').classList.add('hidden');
        }

        async function handleSendResetLink() {
            const email = document.getElementById('reset-email').value.trim();
            const btnSend = document.getElementById('btn-send-link');

            if (!email) {
                showPopup("แจ้งเตือน", "กรุณากรอก Gmail ของคุณ");
                return;
            }

            btnSend.innerText = "กำลังตรวจสอบบัญชี...";
            btnSend.disabled = true;

            const baseUrl = window.location.href.split('student-login.html')[0];

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "request_reset_link",
                        role: "student",
                        email: email,
                        originUrl: baseUrl
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    closeForgotModal();
                    showPopup("สำเร็จ!", "ค้นพบบัญชีในระบบเรียบร้อยแล้ว ระบบได้ส่งอีเมลแจ้งเตือนพร้อมปุ่มเปลี่ยนรหัสผ่านไปที่ Gmail ของคุณแล้ว");
                } else {
                    showPopup("ข้อผิดพลาด", result.message || "ไม่พบบัญชีอีเมลนี้ในระบบสมัครสมาชิก");
                }
            } catch (error) {
                showPopup("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อระบบหลังบ้านได้");
            } finally {
                btnSend.innerText = "ส่งลิงก์เปลี่ยนรหัสผ่าน";
                btnSend.disabled = false;
            }
        }

        async function handleLogin() {
            const studentId = document.getElementById('student-id').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!studentId || !password) {
                showPopup("แจ้งเตือน", "กรุณากรอกเลขประจำตัว/อีเมล และรหัสผ่านให้ครบถ้วน");
                return;
            }

            // แสดงอนิเมชั่นโหลดหมุนๆ
            showLoading("กำลังเข้าสู่ระบบ...");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "login",
                        role: "student",
                        studentId: studentId,
                        password: password
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    const studentSession = {
                        fullName: result.name,
                        className: result.studentLevel,
                        no: result.studentCode || studentId,
                        email: result.email || studentId,
                        institution: result.institution,
                        avatar: result.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop"
                    };
                    
                    sessionStorage.setItem("loggedInUser", JSON.stringify(studentSession));
                    localStorage.setItem('autoOpenSidebar', 'true');

                    // แสดงอนิเมชั่นติ๊กถูกสำเร็จ
                    showSuccess("เข้าสู่ระบบสำเร็จ!");

                    // หน่วงเวลา 1.2 วินาทีเพื่อให้เห็นอนิเมชั่นติ๊กถูก แล้วค่อยย้ายหน้า
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1200);

                } else {
                    // แสดงอนิเมชั่นกากบาท + กล่องสั่น
                    showError(result.message || "รหัสผ่านหรือชื่อผู้ใช้ไม่ถูกต้อง");
                    
                    // หน่วงเวลา 1.5 วินาทีเพื่อให้เห็นกากบาทสั่น แล้วค่อยปิดป๊อปอัพโหลด
                    setTimeout(() => {
                        hideLoading();
                        showPopup("ข้อผิดพลาด", result.message || "ชื่อผู้ใช้และรหัสผ่านผิดพลาด");
                    }, 1500);
                }
            } catch (error) {
                showError("ไม่สามารถเชื่อมต่อระบบได้");
                setTimeout(() => {
                    hideLoading();
                    showPopup("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อระบบหลังบ้านได้");
                }, 1500);
            }
        }
    </script>
</body>
</html>
